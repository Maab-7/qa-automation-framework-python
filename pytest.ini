[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
markers =
    api: API tests
    web: Web UI tests
    mobile: Mobile tests
    integration: Integration tests
    load: Load tests
    smoke: Smoke tests
    slow: Slow running tests